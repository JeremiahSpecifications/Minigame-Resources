name: PackSquash
on: [push]

jobs:
  PackSquash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: robinraju/release-downloader@v1.10
        with:
          repository: 'ComunidadAylas/PackSquash'
          latest: true
          fileName: 'PackSquash.CLI.executable.x86_64-unknown-linux-musl.zip'
          out-file-path: 'Packs'

      - name: Extract
        working-directory: ./Packs
        run: 7z x 'PackSquash.CLI.executable.x86_64-unknown-linux-musl.zip'

      - name: CHMOD
        working-directory: ./Packs
        run: chmod +x packsquash

      - name: Squash All Packs
        working-directory: ./Packs
        run: |
          chmod +x packsquash
          declare -a arr=("vanilla" "cartoon" "chinese-mythology" "city" "fallout" "fantasy" "festive" "greek-mythology" "halloween" "natural" "plastic" "steampunk")
          mkdir out
          for x in "${arr[@]}"
          do
             printf "pack_directory = \"%s\"\noutput_file_path = \"out/%s.zip\"" "$x" "$x"> packsquash-options.toml
            ./packsquash packsquash-options.toml
          done

      - name: Upload Packs
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: Packs/out
